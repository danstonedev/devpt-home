<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Inside simLAB</title><link rel="canonical" href="https://lab.devpt.app/showcase/"></head><body><p><a id="continue" href="https://lab.devpt.app/showcase/">Continue to the live simLAB walkthrough ↗</a></p><script>
// Preserve old public bookmarks without retaining another build of simLAB.
var old = new URLSearchParams(location.search), target = new URL('https://lab.devpt.app/showcase/');
var cases = { patient: 'meet', interview: 'listen', reasoning: 'reason' };
var tools = ['movement', 'joints', 'eyes', 'neuro', 'aquatic', 'vitals'];
if (cases[old.get('area')]) target.searchParams.set('chapter', cases[old.get('area')]);
else if (tools.includes(old.get('area'))) { target.searchParams.set('chapter', 'study'); target.searchParams.set('tool', old.get('area')); }
document.getElementById('continue').href = target.href; location.replace(target.href);
</script></body></html>
