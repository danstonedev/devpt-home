<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080d0a">
    <meta name="robots" content="noindex, nofollow">
    <title>Teaching resources · DevPT</title>
    <meta name="description" content="Explore interactive anatomy, movement and clinical teaching resources. Browse by region or topic, collect resources and share them with your students.">
    <link rel="icon" href="/assets/devpt-logo.png">
    <link rel="stylesheet" href="/local-site-fonts.css">
    <link rel="stylesheet" href="/teaching-library.css">
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div id="app"></div>
    <noscript><main class="main wrap"><h1>DevPT</h1><p>Enable JavaScript to explore the interactive resource library.</p><p><a href="/simlab/">simLAB</a> · <a href="/emrs/">EMRs</a> · <a href="/3dpain/">3Dpain.app</a> · <a href="mailto:daniel.j.stone@und.edu">Contact</a></p></main></noscript>
    <dialog id="modal" aria-label="Resource actions"></dialog>
    <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
    <div id="toast" role="status"></div>
    <dialog class="workspace-live-dialog" id="workspace-live-dialog" aria-labelledby="workspace-live-title">
      <header class="workspace-live-toolbar">
        <h2 id="workspace-live-title">Live product workspace</h2>
        <button type="button" class="button small" data-workspace-close autofocus>Close <span aria-hidden="true">×</span></button>
      </header>
      <div class="workspace-live-notice">
        <p role="status" data-workspace-status>Choose a feature to open its live workspace.</p>
        <a href="/simlab/" data-workspace-full-view target="_blank" rel="noopener">Open directly</a>
      </div>
      <div class="workspace-live-stage" data-workspace-frame-slot></div>
    </dialog>
    <script src="/local-site-config.js"></script>
    <script src="/teaching-library.js"></script>
    <script src="/feature-workspaces.js"></script>
  </body>
</html>
