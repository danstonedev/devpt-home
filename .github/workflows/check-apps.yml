name: Check apps.json

# Owner direction, 26 October 2026 (all repositories): hosted CI is requested
# deliberately for routine changes. Run this from Actions on a branch to verify
# it. The independent weekly check still catches advertised apps going offline.
on:
  schedule:
    - cron: "17 13 * * 1" # weekly (Mon) - catch apps that have gone offline
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate apps.json + check links
        run: node scripts/check-apps.mjs
      - name: Check source-owned walkthrough integration
        run: node scripts/check-live-showcase.mjs
      - name: Check coordinated release gate
        run: node --test scripts/wait-for-showcases.test.mjs
      - name: Check committed EMR foundation contract
        run: node scripts/sync-emr-foundation.mjs --check --snapshot-only
      - name: Check published teaching release contract
        run: node --test scripts/wait-for-teaching-catalog.test.mjs
      - name: Verify explicit public website export
        run: node scripts/build-public-site.mjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check product journeys and trusted walkthrough bridges
        run: npm run test:ui
